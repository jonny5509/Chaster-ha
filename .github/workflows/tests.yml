name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install test dependencies
        run: pip install 'pytest<9' pytest-asyncio pytest-homeassistant-custom-component probatio
      - name: Run tests
        env:
          PYTHONPATH: .
        run: pytest -q
